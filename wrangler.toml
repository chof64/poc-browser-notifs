name = "poc-browser-notifs"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "KV_BINDING"
# Dashboard-owned: Name KV_BINDING -> poc_browser_notifs.
# For CLI `wrangler deploy`, replace with the real namespace ID.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
