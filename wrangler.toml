name = "poc-browser-notifs"
main = "src/worker.js"
compatibility_date = "2024-11-01"
keep_vars = true

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "6b91dda794934a9d9be519ce215b3622"

# Non-secret VAPID vars (dashboard-managed by default).
# [vars]
# VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
# VAPID_SUBJECT = "mailto:you@example.com"

# Secret: set in the dashboard or with `wrangler secret put VAPID_PRIVATE_KEY`.
# Wrangler 4+ syntax; declaring `required` also limits which keys load from `.dev.vars`.
# [secrets]
# required = ["VAPID_PRIVATE_KEY"]
