name = "poc-browser-notifs"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

# NOTE (dashboard Git deploys): keep KV *out* of this file on purpose.
# Create/bind it in Dashboard → Workers → poc-browser-notifs → Bindings → KV:
#   Variable name = PUSH_SUBS  (must match env.PUSH_SUBS in src/worker.js)
# If you put [[kv_namespaces]] here with a placeholder ID, `npx wrangler deploy`
# in the dashboard build will override the dashboard binding and fail with:
#   KV namespace 'REPLACE_WITH_KV_NAMESPACE_ID' is not valid [code: 10042]
#
# CLI alternative (local / direct deploy): uncomment below and paste the real ID
# from `npm run cf:kv:create`:
# [[kv_namespaces]]
# binding = "PUSH_SUBS"
# id = "PASTE_REAL_KV_NAMESPACE_ID_HERE"

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
